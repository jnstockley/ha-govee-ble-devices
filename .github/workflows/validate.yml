name: Validate

'on':
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install tooling
        run: python -m pip install -r requirements-test.txt
      - name: Check Python style
        run: |
          ruff check custom_components scripts tests
          ruff format --check custom_components scripts tests
      - name: Check syntax
        run: python -m compileall -q custom_components scripts tests
      - name: Validate HACS release files and PyPI dependency
        run: python scripts/check_release.py --install-requirement
      - name: Test offline BLE transactions
        run: python -m pytest -q
      - name: Check tag against integration version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release for HACS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping creation."
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
